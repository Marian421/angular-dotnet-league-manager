<div class="min-h-screen flex items-center justify-center bg-slate-900 px-6">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-slate-900 text-center">
      Create an account
    </h1>

    <p class="mt-2 text-center text-slate-500">
      Start managing your league today
    </p>

    <form class="mt-8 space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700">
          Name
        </label>
        <input
          type="text"
          class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-orange-500 focus:ring-orange-500"
          placeholder="John Doe"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">
          Email
        </label>
        <input
          type="email"
          class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-orange-500 focus:ring-orange-500"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">
          Password
        </label>
        <input
          type="password"
          class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-orange-500 focus:ring-orange-500"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-orange-500 py-3 font-semibold text-white hover:bg-orange-600 transition"
      >
        Create Account
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      Already have an account?
      <a routerLink="/login" class="font-medium text-orange-500 hover:underline">
        Sign in
      </a>
    </p>
  </div>
</div>
